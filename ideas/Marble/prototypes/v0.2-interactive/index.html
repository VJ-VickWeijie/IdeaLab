<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#315b43" />
    <title>Marble V0.2｜可点击原型</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="forest">
    <div class="app-frame" id="app">
      <header class="topbar">
        <button class="brand" data-action="home" aria-label="返回探索首页">
          <span class="brand-mark" aria-hidden="true">m</span>
          <span><b>Marble</b><small>一起发现世界</small></span>
        </button>
        <div class="top-actions">
          <label class="theme-picker"><span class="sr-only">全局主题</span>
            <select id="theme-select" aria-label="选择全局主题">
              <option value="forest">森林</option><option value="ocean">海洋</option><option value="space">星空</option><option value="storybook">绘本</option>
            </select>
          </label>
          <button class="icon-button parent-shortcut" data-action="open-parent" aria-label="打开家长陪读">♧</button>
        </div>
      </header>
      <main id="content" tabindex="-1"></main>
      <nav id="bottom-nav" class="bottom-nav" aria-label="主要导航"></nav>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="overlay-root"></div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
