syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.idealab.marble.data.proto";

enum StoredAgeMode {
  AUTO = 0;
  INFANT = 1;
  TODDLER = 2;
}

enum StoredDepth {
  BASIC = 0;
  MORE = 1;
}

message StoredResume {
  string node_id = 1;
  string group_id = 2;
}

message ParentProfile {
  uint32 data_version = 1;
  string birth_date_iso = 2;
  StoredAgeMode age_mode = 3;
  StoredDepth depth = 4;
  repeated string history_node_ids = 5;
  StoredResume resume = 6;
  int64 generation = 7;
}
